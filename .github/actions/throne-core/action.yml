name: Build ThroneCore c-shared
description: >-
  Builds deployment/android-cshared/<abi>/libthrone.so and generates
  app/src/main/assets/schema/sing-box.json (with the Android build tags) from
  throneproj/Throne at the THRONE_CORE_REF pinned in nb4a.properties. The
  c-shared library/schema are cached on production inputs only; the patched
  checkout is cached separately (Go tests included).
runs:
  using: composite
  steps:
    - name: Read core pin
      shell: bash
      run: |
        set -euo pipefail
        REF=$(sed -n 's/^THRONE_CORE_REF=//p' nb4a.properties | tr -d '\r[:space:]')
        test -n "$REF"
        echo "THRONE_CORE_REF=$REF" >> "$GITHUB_ENV"
    # Two independent caches:
    #  * throne-core -> the built AAR + schema, keyed on PRODUCTION inputs only.
    #  * throne-tree -> the patched Throne checkout, keyed on the FULL overlay (tests included).
    # A test-only edit therefore hits the AAR but misses the tree: clone + patch + test in
    # seconds, no gomobile bind. A production edit misses both and rebuilds everything.
    # THRONE_CORE_REF is an immutable commit, so no SHA re-resolution belongs in either key.
    - name: Hash overlay inputs
      id: hash
      # A hashing failure must degrade to a guaranteed cache miss (full build), not fail the job.
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        # A sentinel no real key can match. Emit it up front so even a later abort
        # leaves both cache keys on a miss; real values override it at the end.
        miss() { echo "hash-failed-$(date +%s%N)-$RANDOM-$RANDOM"; }
        FALLBACK=$(miss)
        {
          # The checkout lives outside GITHUB_WORKSPACE so a restored tree is reusable
          # by the patch/test/build steps (and survives an AAR-cache-hit run).
          echo "THRONE_DIR=$(dirname "$GITHUB_WORKSPACE")/Throne"
          echo "PROD_HASH=$FALLBACK"
          echo "OVERLAY_HASH=$FALLBACK"
        } >> "$GITHUB_ENV"

        # Every file under core-patch is a build input: the Go overlay (now spanning
        # core/mobile and the internal packages the Xray removal touches), the AAR build
        # script, and remove-xray.py, which deletes what an overlay cannot.
        PATCH_DIR="buildScript/core-patch"

        if ! ACTION_HASH=$(sha256sum .github/actions/throne-core/action.yml | cut -d' ' -f1) || [ -z "$ACTION_HASH" ]; then
          ACTION_HASH=$(miss)
        fi
        # The overlay script decides how the tree is assembled; a change there must invalidate
        # the cached tree even when every overlay file is unchanged.
        if ! APPLY_HASH=$(sha256sum buildScript/apply-core-patch.sh | cut -d' ' -f1) || [ -z "$APPLY_HASH" ]; then
          APPLY_HASH=$(miss)
        fi

        # The c-shared build script and its package-main wrapper decide the binary.
        if ! BUILD_HASH=$(sha256sum buildScript/build-cshared.sh buildScript/cgoentry/main.go | sha256sum | cut -d' ' -f1) || [ -z "$BUILD_HASH" ]; then
          BUILD_HASH=$(miss)
        fi
        # The overlay also replaces this upstream build script; its TAGS= line
        # drives the generated schema, so it belongs in both cache keys.
        if ! CORE_SCRIPT_HASH=$(sha256sum buildScript/core-patch/script/build_android.sh | cut -d' ' -f1) || [ -z "$CORE_SCRIPT_HASH" ]; then
          CORE_SCRIPT_HASH=$(miss)
        fi

        # Production hash: only what changes the binary/schema. *_test.go are never
        # compiled into the library, so they are excluded explicitly. The generators
        # tools/bindgen/bindgen.py and tools/gen_settings_schema.py are left out on
        # purpose: this action never runs them -- their outputs are already checked
        # into PATCH_DIR, so editing a generator alone cannot change the AAR (CI's
        # generated-file checks catch generator/output drift separately).
        if ! PROD_HASH=$( {
          echo "action:$ACTION_HASH"
          echo "apply:$APPLY_HASH"
          echo "build:$BUILD_HASH"
          echo "core-script:$CORE_SCRIPT_HASH"
          find "$PATCH_DIR" -type f ! -name '*_test.go' -print0 | sort -z | xargs -0 sha256sum
        } | sha256sum | cut -d' ' -f1) || [ -z "$PROD_HASH" ]; then
          PROD_HASH=$(miss)
        fi

        # Full-overlay hash: the same inputs plus the Go tests, so a test-only edit
        # invalidates the tree cache and re-runs them.
        if ! OVERLAY_HASH=$( {
          echo "action:$ACTION_HASH"
          echo "apply:$APPLY_HASH"
          echo "core-script:$CORE_SCRIPT_HASH"
          find "$PATCH_DIR" -type f -print0 | sort -z | xargs -0 sha256sum
        } | sha256sum | cut -d' ' -f1) || [ -z "$OVERLAY_HASH" ]; then
          OVERLAY_HASH=$(miss)
        fi

        # Last GITHUB_ENV write wins: replace the up-front miss sentinels.
        {
          echo "PROD_HASH=$PROD_HASH"
          echo "OVERLAY_HASH=$OVERLAY_HASH"
        } >> "$GITHUB_ENV"
    - name: Patched Throne tree cache
      id: tree-cache
      # A restore failure must take the clone+patch path, not fail the job.
      continue-on-error: true
      uses: actions/cache@v6
      with:
        path: ${{ env.THRONE_DIR }}
        key: throne-tree-${{ runner.os }}-${{ env.THRONE_CORE_REF }}-${{ env.OVERLAY_HASH }}
    - name: ThroneCore cache
      id: cache
      # Same conservative fallback: a restore failure means a full build.
      continue-on-error: true
      uses: actions/cache@v6
      with:
        path: |
          deployment/android-cshared
          app/src/main/assets/schema/sing-box.json
        key: throne-core-${{ runner.os }}-${{ env.THRONE_CORE_REF }}-${{ env.PROD_HASH }}
    # Go and its module cache feed the tests on EVERY run, including a full AAR+tree
    # cache hit, so these two steps are intentionally ungated.
    - name: Install Golang
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: false
    - name: Go module cache
      # Restore failure is non-fatal: `go test` fetches modules on demand.
      continue-on-error: true
      uses: actions/cache@v6
      with:
        path: ~/go/pkg/mod
        key: go-mod-throne-${{ runner.os }}-${{ env.THRONE_CORE_REF }}
        restore-keys: |
          go-mod-throne-${{ runner.os }}-
    - name: Checkout Throne
      if: steps.tree-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$THRONE_DIR"
        git init -q "$THRONE_DIR"
        git -C "$THRONE_DIR" remote add origin https://github.com/throneproj/Throne
        git -C "$THRONE_DIR" fetch -q --depth 1 origin "$THRONE_CORE_REF"
        git -C "$THRONE_DIR" checkout -q --detach FETCH_HEAD
    - name: Apply core bridge patch
      if: steps.tree-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Additive only: the throne_* C ABI lands in core/mobile so the AAR's
        # shared library exports it for Dart FFI and the android/core JNI shim.
        bash buildScript/apply-core-patch.sh "$THRONE_DIR"
    - name: Audit the core bridge patch
      # Run on EVERY invocation, including a warm tree cache. The cached tree is
      # trusted input: a poisoned/partial restore or a cache key that did not
      # change when the pin did must not skip the pin/anchor/banner/Xray checks.
      # The audit only reads files (anchors, generated banners, a core/ scan), so
      # it is cheap on a warm cache; like the Go test step below it is ungated.
      shell: bash
      run: |
        set -euo pipefail
        # The overlay wins silently, so the assumptions it makes about the pin are
        # checked here rather than discovered as an unrelated Go build error.
        python3 tools/diagnostics/core_patch_audit.py --checkout "$THRONE_DIR"
    - name: Install Android NDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # printf, not `yes |`: under pipefail a SIGPIPE after sdkmanager stops
        # reading reads as a failed pipeline; four y's cover the licenses too.
        for attempt in 1 2 3; do
          if printf 'y\ny\ny\ny\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"; then
            break
          fi
          if [ "$attempt" = "3" ]; then
            echo "::error::NDK 28.2.13676358 failed to install three times"
            exit 1
          fi
        done
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
    # The patch ships 8 _test.go files (about 70 cases over the settings encodings, row
    # decoding, int narrowing and the route/profile handlers) that no workflow ever ran.
    # They cover exactly what neither Kotlin nor Dart can see, so a green build said nothing
    # about them. Run on EVERY invocation: on a tree cache hit the tree is already present
    # and Go's module cache is warm, so this is seconds; on a test-only change (AAR hit,
    # tree miss) clone+patch+test still runs here without paying for the gomobile bind.
    - name: Test the core bridge patch
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}/core
      run: |
        set -euo pipefail
        # -count=1 bypasses the result cache so an unchanged commit still reports.
        go test ./mobile/ -count=1 -v
    - name: Build ThroneCore c-shared
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}
      run: |
        set -euo pipefail
        DEST="$GITHUB_WORKSPACE/deployment/android-cshared" \
          bash "$GITHUB_WORKSPACE/buildScript/build-cshared.sh" "$THRONE_DIR"
    # Same registries as the AAR: the Android TAGS of script/build_android.sh (cf. script/gen_schema.sh). with_purego and
    # CGO_ENABLED=0 only keep cronet-go from linking its static library; option registration does not depend on them.
    - name: Generate sing-box schema
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}/core
      run: |
        set -euo pipefail
        TAGS=$(sed -n 's/^TAGS="\(.*\)"$/\1/p' ../script/build_android.sh)
        test -n "$TAGS"
        OUT="$GITHUB_WORKSPACE/app/src/main/assets/schema/sing-box.json"
        mkdir -p "$(dirname "$OUT")"
        CGO_ENABLED=0 go run -trimpath -ldflags=-checklinkname=0 -tags "$TAGS,with_purego" ./cmd/schemagen -o "$OUT"
    - name: Verify ThroneCore c-shared and schema
      shell: bash
      run: |
        set -euo pipefail
        # ANDROID_NDK_HOME is exported only on the cache-miss install step; a warm
        # AAR cache skips it, so derive the same path from ANDROID_HOME here.
        NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/28.2.13676358}"
        READELF="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
        test -x "$READELF" || { echo "::error::llvm-readelf not found at $READELF"; exit 1; }
        # The APK splits (buildSrc Helpers.kt) must match the core targets.
        for abi in arm64-v8a armeabi-v7a x86_64; do
          so="deployment/android-cshared/$abi/libthrone.so"
          test -s "$so" || { echo "::error::missing $so"; exit 1; }
          for symbol in throne_register_callbacks throne_host_call throne_run_action; do
            grep -aq "$symbol" "$so" \
              || { echo "::error::$so has no $symbol"; exit 1; }
          done
          case "$abi" in
            arm64-v8a|x86_64)
              # Android 15+ 16 KB-page devices require LOAD align 0x4000.
              if ! "$READELF" -l "$so" | awk '/LOAD/ && /0x4000/ { found = 1 } END { exit !found }'; then
                echo "::error::$so has no 16 KB-aligned LOAD segment"
                "$READELF" -l "$so" | grep -a LOAD || true
                exit 1
              fi
              ;;
          esac
        done
        python3 -c 'import json, sys; json.load(open(sys.argv[1]))' app/src/main/assets/schema/sing-box.json
