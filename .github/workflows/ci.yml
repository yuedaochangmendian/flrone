name: CI
on:
  # Pull requests are the only automatic run. A merge to main publishes nothing:
  # prereleases are built and uploaded locally with
  # tools/local-build/local-release.sh, so a main CI run would only spend runner
  # time. A stable release calls this workflow through workflow_call, which is
  # what makes GitHub CI and builds happen only when a stable release is cut.
  # Feature branches are validated through their PR only: running both push and
  # pull_request for every branch duplicated the same jobs.
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      # No commit input: a called run validates the caller's commit. Accepting an
      # arbitrary ref here would let a privileged caller check out unreviewed code
      # next to a shared build cache (CodeQL actions/cache-poisoning).
      full:
        description: Validate the whole tree instead of a change-filtered subset
        required: false
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      # A called run (a stable release) validates the whole tree, never a diff.
      # github.event_name stays the caller's event in a reusable workflow, so the
      # caller states this explicitly instead of the callee sniffing the event.
      code: ${{ inputs.full && 'true' || steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # paths-filter needs both sides of a pull-request diff.
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        if: ${{ !inputs.full }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'app/**'
              - 'android/**'
              - 'flronemodel/**'
              - 'buildSrc/**'
              - 'buildScript/**'
              - 'flutter/**'
              - 'gradle/**'
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'tools/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'repositories.gradle.kts'
              - 'lint.xml'
              - 'nb4a.properties'

  build:
    name: Unit tests and debug build
    needs: changes
    # No `if:` on the filter's *result*: an `if: needs.changes.result == 'success'`
    # would turn a transient path-filter failure (a GitHub API blip, a rate limit)
    # into skipped jobs — and GitHub counts a skipped job as a satisfied required
    # check, so a PR could go green with nothing having run.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        if: ${{ needs.changes.outputs.code == 'true' }}
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssDebug
      # ConfigGeneratorGoldenTest already asserts expected.json byte-for-byte while the unit
      # tests run; this independent pass reports the first byte offset and JSON pointer when a
      # fixture drifts, and it validates the fixture documents without needing Gradle.
      - name: Check config.build golden fixtures
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: python3 tools/diagnostics/config_golden.py --check
      # bindgen.py's six outputs are checked in, so a generator edit without a
      # matching regeneration silently rots the tree. The P2b/P3 runtime drift
      # (emit_go_runtime() still calling 12 retired typed C callbacks) shipped
      # because no gate compared the generated text with the checked-in file.
      # android-build's throne-core action cloned the pinned patched tree to
      # $THRONE_DIR, so bindgen's --go-src is available here.
      - name: Check bindgen idempotence
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: python3 tools/diagnostics/bindgen_check.py --go-src "$THRONE_DIR/core/mobile"
      - name: Audit the Flutter AAR
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          AAR=$(find flutter/build/host/outputs/repo -name "*.aar" | head -1)
          test -n "$AAR"
          python3 tools/diagnostics/scan_aar_apis.py "$AAR"
          # The AAR's `io.flrone/*` channels have no in-repo Kotlin counterpart to
          # diff against; the budget in aar_channels.txt is their contract.
          python3 tools/diagnostics/aar_channel_audit.py "$AAR"
      # The NDK is installed by android-build; its clang is the exact one the
      # release build uses, so preamble syntax errors are caught before linking.
      - name: Check cgo preambles
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          # check_preamble.py reads os.environ only; a bare `CLANG=` assignment
          # is not exported to the child process, so the gate silently fell back
          # to whatever clang was on PATH instead of the NDK clang.
          export CLANG="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          python3 tools/diagnostics/check_preamble.py
      # A preamble that compiles still links nothing if the .c providing those
      # declarations lives outside the package directory: Android accepts an .so
      # with undefined symbols and the app then dies at dlopen. This gate is what
      # three green prereleases were missing (see cgo_linkage.py).
      - name: Check cgo C linkage
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: python3 tools/diagnostics/cgo_linkage.py

  # The oss flavor is what CI builds and what CI's contract audits exercise; the
  # fdroid flavor was previously never compiled by any workflow. Build it in a
  # separate job with the exact same pinned toolchain/inputs (composite actions
  # and the Gradle wrapper), but no signing secrets: `sign: false` leaves the
  # release unsigned, which is enough to catch flavor-specific Kotlin/config
  # breakage. This job is additive: the existing required oss build/test jobs are
  # untouched, and this new job is deliberately not a required check so a
  # transient F-Droid toolchain failure cannot block unrelated PRs.
  fdroid-build:
    name: F-Droid flavor compile
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check F-Droid prebuild contract
        if: ${{ needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # prebuild.sh runs on the F-Droid builder (it fetches the pinned core
          # and bundles assets into this checkout); a syntax error in it would
          # otherwise only surface in that external build. The full script also
          # needs Go/SDK/network, which the android-build action provides below.
          bash -n buildScript/fdroid/prebuild.sh
          # Its three remote inputs must stay pinned in the composite actions;
          # prebuild.sh parses these exact values via its pin_from helper.
          for kv in \
            '.github/actions/routeprofiles/action.yml SRS_REF' \
            '.github/actions/routeprofiles/action.yml PROFILE_REF' \
            '.github/actions/sing-box-dashboard/action.yml DASHBOARD_REF'; do
            set -- $kv
            grep -Eq "^[[:space:]]*$2=[0-9a-f]{7,40}" "$1"
          done
      - name: Build F-Droid flavor
        if: ${{ needs.changes.outputs.code == 'true' }}
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleFdroidRelease
          sign: 'false'

  flutter-tests:
    name: Flutter module tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Channel contract audit
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: python3 tools/diagnostics/channel_audit.py
      - name: Bridge contract audits
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          python3 tools/diagnostics/symbol_audit.py
          # P5: the checked-in generated files must stay narrowed to the live
          # whitelist. This catches a bindgen.py re-run restoring the 427 dead
          # exports, or a hand edit adding one outside live_exports.txt.
          python3 tools/bindgen/prune_exports.py --check
          # ADR 0002's action bus: Go Method constants, dispatcher registry and
          # Dart ActionMethod must agree by wire name. A hard gate — a missing
          # input file fails it rather than skipping the check.
          python3 tools/diagnostics/action_contract.py
          # ADR 0005 final stage: the profile editor's Kotlin-only work crosses
          # as ONE `profiles.platform` call; its op table, the Dart call sites
          # and the payload keys each handler reads must agree (the method-level
          # audit cannot see an op or a key inside the payload). The self-test
          # exercises the parsers on fixtures, so a broken audit cannot pass by
          # finding nothing.
          python3 tools/diagnostics/platform_duty_audit.py --self-test
          python3 tools/diagnostics/platform_duty_audit.py
          python3 tools/diagnostics/settings_audit.py --summary
          # Phase 3e's generated Go schema must still match SettingsSchema.kt:
          # it is a contract, even though settings itself is channel-owned.
          python3 tools/diagnostics/settings_contract.py
          python3 tools/diagnostics/ffi_regression_test.py
          python3 tools/diagnostics/generated_models_check.py
          # ADR 0006 legacy-Room-chain removal: Room AND its one-time seed chain
          # are gone. No app code may name Room or the retired reader/methods,
          # the UI-doc seed and SettingsJsonStore must have no legacy seams,
          # RouteJsonStore stays read-only, and the old schema/Room-snapshot
          # audits must stay gone. The self-test drives the detectors on
          # fixtures, so a broken audit cannot pass by finding nothing.
          python3 tools/diagnostics/legacy_reader_audit.py --self-test
          python3 tools/diagnostics/legacy_reader_audit.py
          # The JVM accepts regexes Android's ICU rejects; see the pre.17 crash.
          python3 tools/diagnostics/kotlin_regex_audit.py
          # The core patch overlay wins silently over upstream. Its checks are exercised
          # here; the real pinned checkout is audited in the core build step, where it exists.
          python3 tools/diagnostics/core_patch_audit.py --self-test
          # A renamed Gradle module must stay in both workflow path filters, or
          # a PR touching only that module silently skips the build (6e5e0d0e).
          python3 tools/diagnostics/workflow_path_audit.py --self-test
          python3 tools/diagnostics/workflow_path_audit.py
          python3 tools/diagnostics/py_syntax_check.py tools/diagnostics/*.py tools/bindgen/*.py buildScript/*.py buildScript/core-patch/*.py
      # Locale completeness is a ratchet, not a gate on the absolute count: 885
      # known gaps across 19 locales predate this job, so failing on any gap
      # would block every unrelated change. `--ratchet` compares the *set* of
      # gaps against tools/diagnostics/i18n_baseline.txt, so translating a string
      # while adding an untranslated one still fails even though the total did
      # not move. Fixing gaps is always allowed; the accepted ceiling only goes
      # down, via a deliberate --update-baseline.
      - name: i18n coverage ratchet
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: python3 tools/diagnostics/i18n_coverage.py --ratchet
      - name: Set up Flutter
        if: ${{ needs.changes.outputs.code == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          # Same pin as android-build/action.yml; two different SDKs made
          # --fatal-infos disagree between the build and test runners.
          flutter-version: '3.50.0'
          cache: true
      - name: Analyze
        if: ${{ needs.changes.outputs.code == 'true' }}
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --fatal-infos
      - name: Test
        if: ${{ needs.changes.outputs.code == 'true' }}
        working-directory: flutter
        run: flutter test --coverage
      - name: Coverage floor
        if: ${{ needs.changes.outputs.code == 'true' }}
        working-directory: flutter
        # --report-dirs prints every lib/<dir> percentage so per-directory floors
        # (--min-dir lib/data:NN) can be set from a measured number, not a guess.
        run: |
          python3 ../tools/diagnostics/coverage_gate.py coverage/lcov.info \
            --min 60 \
            --exclude 'lib/core/throne_ffi.dart' \
            --exclude 'lib/ui/**' \
            --min-dir lib/box_api.dart:32 \
            --min-dir lib/pages:50 \
            --report-dirs
      - name: Upload coverage
        if: ${{ always() && needs.changes.outputs.code == 'true' && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: warn
