name: Release
on:
  # The only release path: a successful CI run on main publishes the next
  # prerelease for the version declared in nb4a.properties. There is no manual
  # dispatch and no tag push trigger — one commit line, one release path.
  # Stable releases are a deliberate, explicit promotion afterwards, never an
  # automatic side effect of merging to main.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  # Download the build-inputs artifact produced by the CI run that triggered
  # this release (cross-workflow artifact access requires actions: read).
  actions: read
jobs:
  release:
    name: Build and publish a prerelease
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      # The version base is the single source of truth in nb4a.properties.
      # Each main build publishes the next vX.Y.Z-pre.N prerelease; N advances
      # from the highest existing preview tag, so consecutive merges need no
      # version bump. Bump VERSION_NAME (and add its CHANGELOG section) to
      # start a new version line. A stable release is never produced here: it
      # is a separate vX.Y.Z release published by hand from the preview's
      # commit (docs/release-runbook.md), because a -pre.N release must stay
      # marked as a prerelease and must not carry throne-update.json.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          DECLARED=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$DECLARED"
          SKIP=false

          # A queued workflow_run can outlive the commit that triggered it. Only
          # the current main commit may publish, otherwise an older CI run could
          # publish over a newer one.
          for attempt in 1 2 3; do
            if git fetch --no-tags origin main; then break; fi
            if [ "$attempt" = "3" ]; then
              echo "::error::could not fetch origin/main for the release"
              exit 1
            fi
            sleep 10
          done
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::CI commit is no longer main; the newer CI run will publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A docs/governance-only merge does not produce a new APK. Compare
          # against the latest reachable release tag so a docs commit after an
          # already-published app commit is skipped, while a failed app release
          # remains eligible on the next main run.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGED=$(git diff --name-only "$PREVIOUS_TAG"..HEAD)
          else
            CHANGED=$(git ls-files)
          fi
          APP_CHANGED=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              app/*|flutter/*|android/*|bboxmodel/*|buildSrc/*|buildScript/*|gradle/*|\
              gradle.properties|gradlew|gradlew.bat|settings.gradle.kts|build.gradle.kts|\
              repositories.gradle.kts|lint.xml|nb4a.properties|.github/actions/*)
                APP_CHANGED=true
                break
                ;;
            esac
          done <<< "$CHANGED"
          if [ "$APP_CHANGED" != "true" ]; then
            echo "::notice::no app or build-input changes since $PREVIOUS_TAG; skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Advance the preview number from the highest existing tag for this
          # version. A failed ls-remote must abort, never read as "no tags":
          # guessing N would reuse a tag and clobber an already published APK.
          PREVIEWS=""
          listed=false
          for _ in 1 2 3; do
            if PREVIEWS=$(git ls-remote --tags origin "refs/tags/v${DECLARED}-pre.*" 2>/dev/null); then
              listed=true
              break
            fi
            echo "::warning::git ls-remote could not reach origin; retrying"
            sleep 5
          done
          if [ "$listed" != true ]; then
            echo "::error::could not list existing preview tags; retry the run"
            exit 1
          fi
          LAST=$(printf '%s\n' "$PREVIEWS" |
            sed -n "s#.*/v${DECLARED}-pre\.\([0-9]\{1,\}\)\$#\1#p" |
            sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          if [ "$N" -gt 998 ]; then
            echo "::error::preview number exhausted for v${DECLARED}; bump VERSION_NAME"
            exit 1
          fi
          TAG="v${DECLARED}-pre.${N}"

          echo "version=${DECLARED}-pre.${N}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=preview" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          echo "build_number=$N" >> "$GITHUB_OUTPUT"
          echo "notes_version=$DECLARED" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Changelog
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          NOTES_VERSION: ${{ steps.version.outputs.notes_version }}
        run: bash buildScript/release_notes.sh "$NOTES_VERSION" > /dev/null
      # CI already built the Gradle inputs for this exact commit. Reuse them
      # instead of rebuilding the Flutter AAR, ThroneCore, routeprofiles and
      # dashboard. A missing or expired artifact falls back to a full build.
      #
      # The artifact is treated as untrusted input (CodeQL's "artifact
      # poisoning" class): it is never executed, and the next step refuses it
      # unless the CI run it came from built the same commit this job checked
      # out. Only build outputs are read back, never scripts.
      - name: Reuse CI build inputs
        id: reuse
        if: ${{ steps.version.outputs.skip != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: build-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build-inputs
      - name: Resolve reused inputs
        id: inputs
        if: ${{ steps.version.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          ok=false
          if [ "${{ steps.reuse.outcome }}" = "success" ]; then
            # The artifact is only usable when it was produced by the CI run of
            # the commit under build. Anything else is discarded.
            ci_sha='${{ github.event.workflow_run.head_sha }}'
            head_sha=$(git rev-parse HEAD)
            if [ "$ci_sha" = "$head_sha" ]; then
              cp -a build-inputs/. .
              rm -rf build-inputs
              ok=true
              echo "Reusing build inputs built from $ci_sha."
            else
              echo "::warning::CI artifact is from $ci_sha but this build is $head_sha; discarding it."
              rm -rf build-inputs
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = true ] || echo "::notice::CI build inputs unavailable; running a full build."
      - name: Build
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: ${{ steps.version.outputs.channel }}
          build-number: ${{ steps.version.outputs.build_number }}
          sign: 'true'
          reuse-inputs: ${{ steps.inputs.outputs.ok }}
      - name: Release assets
        if: steps.version.outputs.skip != 'true'
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist preview
      - name: Publish release
        id: publish
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          NOTES_VERSION: ${{ steps.version.outputs.notes_version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash buildScript/publish_release.sh
      # No --latest here: a prerelease must never displace the current stable
      # release or the in-app updater. Promotion is an explicit maintainer
      # action (gh release edit <tag> --prerelease=false --title ... --latest).
      # A GitHub API outage must not lose the signed APKs.
      - name: Preserve assets when publishing fails
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Flrone-${{ steps.version.outputs.tag }}-publish-failed
          path: dist/
          if-no-files-found: error
          retention-days: 14
