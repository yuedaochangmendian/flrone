# Perfetto trace config for throne-flclash-ui performance runs.
#
# Usage (on the device, or via `adb shell perfetto`):
#   adb push tools/perf/perfetto.cfg /data/local/tmp/perfetto.cfg
#   adb shell perfetto -c /data/local/tmp/perfetto.cfg \
#       -o /data/local/tmp/trace.perfetto-trace --txt
#   adb pull /data/local/tmp/trace.perfetto-trace tools/perf/out/<run>/trace.perfetto-trace
#
# `--txt` is required for this textproto config on older perfetto builds; newer
# builds auto-detect it. `--txt` is accepted by both. Set duration_ms to cover
# the whole scenario before starting (the default below is a 60s window).
#
# Categories: app (atrace_apps), system scheduling/frequency (sched/freq),
# graphics (gfx/view), binder, and SurfaceFlinger (its atrace events land on the
# gfx/trace_event ftrace event). Buffer sizes are deliberately modest for a
# 60s capture; raise size_kb if the trace shows "data loss" in the UI.

buffers {
  size_kb: 63488
  fill_policy: RING_BUFFER
}
buffers {
  size_kb: 4096
  fill_policy: DISCARD
}

duration_ms: 60000

data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      # App-only atrace markers (Dart timeline + framework rendering traces).
      atrace_apps: "com.throneflclash"

      # Atrace categories: scheduling, CPU/GPU frequency, graphics/view,
      # SurfaceFlinger (via gfx), and binder.
      atrace_categories: "sched"
      atrace_categories: "freq"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "binder_driver"
      atrace_categories: "binder_lock"
      atrace_categories: "dalvik"

      # Explicit kernel events (independent of atrace category filtering).
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_wakeup_new"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "power/gpu_frequency"
      ftrace_events: "binder/binder_transaction"
      ftrace_events: "binder/binder_transaction_received"
      ftrace_events: "binder/binder_lock"
      ftrace_events: "binder/binder_locked"
      ftrace_events: "binder/binder_unlock"
      ftrace_events: "gfx/trace_event"
      ftrace_events: "mm_event/mm_event_record"
    }
  }
}

# Process/cgroup metadata: maps slices to the app process and thread names.
data_sources {
  config {
    name: "android.process_stats"
    android_process_stats_config {
      android_process_stats_poll_interval_ms: 1000
    }
  }
}

data_sources {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 1000
    }
  }
}
