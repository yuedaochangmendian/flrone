[package]
name = "rule-match-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ahash = { version = "0.8", default-features = false }

# A spike, not a dependency: the point is to measure a Rust suffix matcher
# against the same algorithm in Go before deciding whether the core should link
# it. The staticlib targets below are what a cgo/android build would consume.
[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
